<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraped Quotes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Quotes</h1>
    </header>
    <main>
        <button id="refresh-button">Refresh Quotes</button>
        <input type="text" id="search-input" placeholder="Search quotes or authors...">
        <div id="quotes-container">
            <!-- Quotes will be loaded here by JavaScript -->
            <p>Loading quotes...</p>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
